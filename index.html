<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Songs for You</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,600;1,500&family=Quicksand:wght@400;500;600;700&family=Caveat:wght@500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --cream: #f3e9de;
    --paper: #faf3e8;
    --rose: #d68f92;
    --rose-deep: #b96c72;
    --sage: #97a17c;
    --sage-deep: #767f5f;
    --ink: #4a3a35;
    --ink-soft: #7c6a63;
    --gold: #c9a06a;
  }

  *{ box-sizing: border-box; }

  html, body{
    margin:0; padding:0;
    background: var(--cream);
    font-family: 'Quicksand', sans-serif;
    color: var(--ink);
    overflow-x: hidden;
    overflow-y: auto;
    min-height: 100%;
    -webkit-overflow-scrolling: touch;
  }

  .stage{
    position: relative;
    width: 100%;
    min-height: 100vh;
    min-height: 100dvh;
    overflow: visible;
  }

  /* ---------- background wallpaper (final scene) ---------- */
  .wallpaper{
    position:absolute; inset:0;
    background:
      radial-gradient(circle at 15% 20%, rgba(214,143,146,0.16) 0, transparent 40%),
      radial-gradient(circle at 85% 75%, rgba(151,161,124,0.14) 0, transparent 42%),
      linear-gradient(180deg, #f6ecdf 0%, #f1e3d4 100%);
    opacity: 0;
    transition: opacity 1.4s ease;
    z-index: 0;
  }
  .stage.scene-card .wallpaper{ opacity: 1; }

  .wallpaper svg{ position:absolute; inset:0; width:100%; height:100%; opacity:0.5; }

  /* ---------- Scene 1: envelope ---------- */
  .envelope-scene{
    position:absolute; inset:0;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    gap: 28px;
    min-height: 100vh;
    min-height: 100dvh;
    transition: opacity .7s ease, transform .7s ease;
    z-index: 5;
  }
  .stage.scene-bloom .envelope-scene,
  .stage.scene-card .envelope-scene{
    opacity: 0;
    transform: scale(0.92);
    pointer-events: none;
  }

  .envelope{
    width: 220px; height: 150px;
    position: relative;
    cursor: pointer;
    filter: drop-shadow(0 18px 30px rgba(110, 80, 60, 0.18));
  }
  .envelope-body{
    position:absolute; inset:0;
    background: var(--paper);
    border-radius: 6px;
    border: 1px solid #e2cdb2;
  }
  .envelope-flap{
    position:absolute; top:0; left:0; width:100%; height:100%;
    clip-path: polygon(0 0, 100% 0, 50% 58%);
    background: linear-gradient(160deg, #f1e3ce, #e7d3b3);
    border-radius: 6px 6px 0 0;
    transform-origin: top center;
    transition: transform 0.6s cubic-bezier(.6,.1,.3,1);
    z-index: 3;
  }
  .envelope.open .envelope-flap{
    transform: rotateX(180deg);
  }
  .envelope-shadow-fold{
    position:absolute; inset:0;
    clip-path: polygon(0 100%, 50% 45%, 100% 100%);
    background: linear-gradient(0deg, #ecdcc2, #f5e9d5);
  }
  .envelope-sprig{
    position:absolute; left:50%; top:40%; transform: translate(-50%,-50%);
    width: 70px; z-index: 4; opacity: 0.9;
  }
  .tap-hint{
    font-family: 'Caveat', cursive;
    font-size: 22px;
    color: var(--rose-deep);
    letter-spacing: 0.5px;
    animation: floaty 2.4s ease-in-out infinite;
  }
  @keyframes floaty{
    0%,100%{ transform: translateY(0); opacity: 0.85;}
    50%{ transform: translateY(-4px); opacity: 1;}
  }

  /* ---------- Scene 2: bloom transition ---------- */
  .bloom-scene{
    position:absolute; inset:0;
    display:flex; align-items:center; justify-content:center;
    min-height: 100vh;
    min-height: 100dvh;
    opacity: 0;
    pointer-events:none;
    z-index: 4;
    transition: opacity .5s ease;
  }
  .stage.scene-bloom .bloom-scene{ opacity: 1; pointer-events:auto; }
  .stage.scene-card .bloom-scene{ opacity: 0; pointer-events:none; transition: opacity .9s ease; }

  .petal-burst{ position:absolute; inset:0; overflow:hidden; }
  .petal{
    position:absolute;
    width: 46px; height: 46px;
    border-radius: 60% 40% 55% 45% / 55% 45% 55% 45%;
    opacity: 0;
  }
  .stage.scene-bloom .petal{ animation: petalIn 1.1s ease forwards; }

  @keyframes petalIn{
    0%{ opacity:0; transform: translate(0,0) scale(0.2) rotate(0deg); }
    60%{ opacity:1; }
    100%{ opacity:0.95; transform: translate(var(--tx), var(--ty)) scale(1) rotate(var(--rot)); }
  }

  .bloom-center{
    position:relative; z-index:2;
    font-family:'Playfair Display', serif;
    font-style: italic;
    font-size: 26px;
    color: var(--ink);
    opacity: 0;
    transition: opacity .6s ease .5s;
  }
  .stage.scene-bloom .bloom-center{ opacity: 0.85; }

  /* ---------- Scene 3: mixtape card ---------- */
  .card-scene{
    position:relative;
    display:flex; align-items:center; justify-content:center;
    width: 100%;
    min-height: 100vh;
    min-height: 100dvh;
    padding: 40px 20px;
    opacity: 0;
    transform: translateY(18px);
    transition: opacity .9s ease .15s, transform .9s ease .15s;
    z-index: 1;
    pointer-events:none;
    margin-top: -100vh;
    margin-top: -100dvh;
  }
  .stage.scene-card .card-scene{
    opacity: 1; transform: translateY(0); pointer-events:auto;
    margin-top: 0;
    position: relative;
    z-index: 6;
  }
  .stage:not(.scene-card) .card-scene{
    position: absolute;
    inset: 0;
    margin-top: 0;
  }

  .layout{
    display:flex; align-items:flex-start; gap: 0;
    max-width: 1000px; width:100%;
    position: relative;
    flex-wrap: wrap;
    justify-content: center;
  }

  .side-stack{
    width: 300px;
    display:flex; flex-direction:column; gap: 16px;
    margin-top: 24px;
    /* numpuk di atas kartu kaset, kayak contoh gambar */
    margin-right: -60px;
    transform: translateX(-40px) scale(0.94);
    opacity: 0;
    pointer-events:none;
    transition: transform .6s cubic-bezier(.2,.8,.3,1), opacity .6s ease;
    position:relative; z-index:3;
  }
  .side-stack.visible{
    transform: translateX(0) scale(1);
    opacity: 1;
    pointer-events:auto;
  }

  @media (min-width: 721px){
    /* card digeser dikit ke kanan biar side-stack numpuk rapi di kirinya */
    .side-stack ~ .card{ margin-left: 20px; }
  }

  /* buket bunga */
  .bouquet-panel{
    background: linear-gradient(165deg, #4a3a3d, #2a2220);
    border-radius: 16px;
    overflow: hidden;
    box-shadow: 0 25px 50px rgba(0,0,0,0.3);
    position: relative;
  }
  .bouquet-photo{
    position: relative;
    width: 100%;
    aspect-ratio: 4 / 3;
    overflow: hidden;
    background: radial-gradient(circle at 30% 25%, rgba(214,143,146,0.35), transparent 55%),
                radial-gradient(circle at 75% 70%, rgba(151,161,124,0.28), transparent 50%),
                #362b29;
  }
  .bouquet-photo img{
    width:100%; height:100%; object-fit:cover; display:block;
  }
  .bouquet-photo svg{ position:absolute; inset:0; width:100%; height:100%; }
  .bouquet-caption{
    padding: 13px 16px 15px;
    color: #f4ece4;
  }
  .bouquet-caption .bq-title{
    font-family: 'Playfair Display', serif;
    font-style: italic;
    font-size: 16px;
  }
  .bouquet-caption .bq-sub{
    font-size: 12px;
    color: #cabdb2;
    margin-top: 2px;
  }

  /* ---------- Spotify + YouTube mini-player stack ---------- */
  .side-player{
    display: flex;
    flex-direction: column;
    gap: 12px;
    max-height: 0;
    opacity: 0;
    overflow: hidden;
    transition: max-height .5s ease, opacity .4s ease;
  }
  .side-player.visible{
    max-height: 900px;
    opacity: 1;
  }
  .spotify-embed-wrap{
    border-radius: 14px;
    overflow: hidden;
    box-shadow: 0 18px 34px rgba(0,0,0,0.22);
    background: #121212;
  }
  .spotify-embed-wrap iframe{
    width: 100%;
    height: 152px;
    border: 0;
    display: block;
  }
  .youtube-embed-wrap{
    border-radius: 14px;
    overflow: hidden;
    box-shadow: 0 18px 34px rgba(0,0,0,0.22);
    background: #000;
  }
  .youtube-embed-wrap iframe{
    width: 100%;
    aspect-ratio: 16 / 9;
    border: 0;
    display: block;
  }
  .player-empty-hint{
    font-size: 12.5px;
    color: var(--ink-soft);
    font-style: italic;
    text-align: center;
    padding: 10px 4px;
  }

  .card{
    background: var(--paper);
    border-radius: 4px 22px 22px 22px;
    box-shadow: 0 30px 60px rgba(90, 63, 48, 0.18);
    padding: 40px 44px 36px;
    width: 620px;
    max-width: 100%;
    position: relative;
    z-index: 2;
  }
  .eyebrow{
    font-size: 13px;
    color: var(--ink-soft);
    letter-spacing: 0.3px;
    margin-bottom: 6px;
  }
  .eyebrow b{ color: var(--rose-deep); font-weight:600; }
  h1.title{
    font-family: 'Playfair Display', serif;
    font-weight: 600;
    font-size: 40px;
    margin: 0 0 26px;
    color: var(--ink);
  }

  .cassette-wrap{ display:flex; justify-content:center; margin-bottom: 30px; }
  .cassette{
    width: 300px;
    max-width: 100%;
    height: auto;
    filter: drop-shadow(0 14px 20px rgba(90,63,48,0.18));
  }
  .reel{ transform-origin: center; animation: spin 6s linear infinite paused; }
  .playing .reel{ animation-play-state: running; }

  .content-grid{
    display:grid; grid-template-columns: 1.3fr 1fr; gap: 26px;
  }

  .tracklist{ display:flex; flex-direction:column; gap: 4px; }
  .track-row{
    display:flex; align-items:center; gap: 14px;
    padding: 12px 4px;
    border-bottom: 1px solid #e8dac3;
    cursor: pointer;
  }
  .track-row:last-child{ border-bottom:none; }
  .track-row.active-row{ background: rgba(151,161,124,0.10); border-radius: 8px; }
  .track-num{
    font-family:'Playfair Display', serif;
    font-style: italic;
    color: var(--ink-soft);
    font-size: 15px;
    width: 20px;
  }
  .track-info{ flex:1; min-width: 0; }
  .track-name{ font-weight: 600; font-size: 15px; color: var(--ink); }
  .track-artist{ font-size: 12.5px; color: var(--ink-soft); margin-top:1px; }
  .play-btn{
    width: 32px; height: 32px; border-radius:50%;
    background: var(--sage);
    color: #fff;
    display:flex; align-items:center; justify-content:center;
    border: none; cursor:pointer;
    transition: background .2s ease, transform .2s ease;
    flex-shrink:0;
  }
  .play-btn:hover{ background: var(--sage-deep); transform: scale(1.05); }
  .play-btn.active{ background: var(--rose-deep); }
  .yt-link{
    font-size: 11px;
    color: var(--ink-soft);
    text-decoration: none;
    border: 1px solid #d8cbb8;
    border-radius: 10px;
    padding: 3px 7px;
    flex-shrink: 0;
    white-space: nowrap;
  }
  .yt-link:hover{ background: #f0e4cf; }
  .now-playing{
    margin-top: 10px;
    font-size: 12.5px;
    color: var(--ink-soft);
    font-style: italic;
  }
  .now-playing b{ color: var(--rose-deep); font-style:normal; }

  .liner-note{
    background: #f6e9b8;
    background-image: linear-gradient(#e9dca4 1px, transparent 1px);
    background-size: 100% 24px;
    padding: 20px 18px;
    border-radius: 2px;
    box-shadow: 0 8px 18px rgba(0,0,0,0.08);
    transform: rotate(1.2deg);
    font-family: 'Caveat', cursive;
    color: #4a3f24;
  }
  .liner-note .label{
    font-family:'Quicksand', sans-serif;
    font-size: 10.5px;
    letter-spacing: 0.6px;
    color: #8a7a44;
    margin-bottom: 8px;
    font-weight:600;
  }
  .liner-note p{ font-size: 19px; line-height: 1.35; margin: 0 0 10px; }
  .liner-note .sign{ text-align:right; font-size: 20px; }

  .finish-wrap{ display:flex; justify-content:flex-start; margin-top: 22px; }
  .finish-btn{
    background: var(--sage-deep);
    color: #f4ece0;
    border: none;
    border-radius: 999px;
    padding: 11px 22px;
    font-family: 'Quicksand', sans-serif;
    font-weight: 700;
    font-size: 12px;
    letter-spacing: 0.6px;
    text-transform: uppercase;
    cursor: pointer;
    box-shadow: 0 10px 20px rgba(90,63,48,0.18);
    transition: background .2s ease, transform .15s ease;
  }
  .finish-btn:hover{ background: #5e6650; transform: translateY(-1px); }

  @keyframes spin{ from{transform:rotate(0)} to{transform:rotate(360deg)} }

  @media (max-width: 720px){
    .layout{ flex-direction: column; align-items: center; gap: 18px; }
    .content-grid{ grid-template-columns: 1fr; }
    .card{ padding: 28px 20px 24px; width: 100%; }
    h1.title{ font-size: 30px; }
    .side-stack ~ .card{ margin-left: 0; }
    .card-scene{ padding: 24px 14px; }

    /* Di HP, side-stack jadi "bubble" mengambang deket tombol ♥ —
       nggak lagi numpuk di atas kartu, jadi nggak perlu geser naik/turun
       buat lihat buket & player. Tekan ♥ buat buka/tutup bubble-nya. */
    .side-stack{
      position: fixed;
      left: 16px;
      right: 16px;
      bottom: 84px;
      width: auto;
      max-width: 320px;
      max-height: min(64vh, 480px);
      overflow-y: auto;
      margin: 0;
      padding: 10px;
      background: var(--paper);
      border-radius: 20px;
      box-shadow: 0 20px 45px rgba(90,63,48,0.32);
      transform-origin: bottom left;
      transform: translateY(14px) scale(0.82);
      z-index: 25;
    }
    .side-stack.visible{
      transform: translateY(0) scale(1);
    }
    /* ekor kecil nunjuk ke tombol ♥, biar jelas asalnya dari situ */
    .side-stack::after{
      content: "";
      position: absolute;
      left: 18px;
      bottom: -9px;
      width: 18px;
      height: 18px;
      background: var(--paper);
      border-radius: 0 0 0 6px;
      transform: rotate(45deg);
      box-shadow: 3px 3px 6px rgba(90,63,48,0.12);
    }

    /* gambar buket dikecilin di HP biar nggak makan tempat & sisa
       konten (Spotify/YouTube) kelihatan tanpa banyak scroll */
    .bouquet-photo{
      aspect-ratio: auto;
      height: 130px;
    }
  }

  .heart-btn{
    position:fixed; bottom: 22px; left: 22px;
    width:44px; height:44px; border-radius:50%;
    background: rgba(60,20,25,0.35);
    color:#e9a7ad;
    display:flex; align-items:center; justify-content:center;
    font-size: 20px; cursor:pointer;
    z-index: 20;
    backdrop-filter: blur(4px);
    transition: transform .15s ease;
    opacity: 0;
    pointer-events: none;
  }
  .stage.scene-card .heart-btn{ opacity: 1; pointer-events:auto; }
  .heart-btn:hover{ transform: scale(1.08); }
  .heart-btn.liked{ color:#ff5c68; }
</style>
</head>
<body>

<div class="stage" id="stage">

  <div class="wallpaper" id="wallpaper"></div>

  <!-- Scene 1: envelope -->
  <div class="envelope-scene" id="envelopeScene">
    <div class="envelope" id="envelope">
      <div class="envelope-shadow-fold"></div>
      <div class="envelope-body"></div>
      <svg class="envelope-sprig" viewBox="0 0 60 60" fill="none">
        <path d="M30 50 C 30 35, 25 25, 18 12" stroke="#8a9a6e" stroke-width="1.4"/>
        <path d="M30 50 C 30 35, 35 25, 42 12" stroke="#8a9a6e" stroke-width="1.4"/>
        <circle cx="30" cy="40" r="5" fill="#c98f95"/>
        <circle cx="18" cy="12" r="4" fill="#d9a6ab"/>
        <circle cx="42" cy="12" r="4" fill="#e7c9a0"/>
      </svg>
      <div class="envelope-flap"></div>
    </div>
    <div class="tap-hint">Ketuk untuk membuka</div>
  </div>

  <!-- Scene 2: bloom transition -->
  <div class="bloom-scene" id="bloomScene">
    <div class="petal-burst" id="petalBurst"></div>
  </div>

  <!-- Scene 3: mixtape card -->
  <div class="card-scene" id="cardScene">
    <div class="layout">

      <div class="side-stack" id="sideStack">
        <div class="bouquet-panel" id="bouquetPanel">
          <div class="bouquet-photo" id="bouquetPhoto"></div>
          <div class="bouquet-caption">
            <div class="bq-title">Buket bunga untukmu</div>
          </div>
        </div>

        <!-- FIX: dulu <audio src="songs/...mp3"> — file lokal gini cuma
             jalan kalau mp3-nya beneran diupload ke folder "songs/" di
             hosting yang sama. Begitu HTML ini dibagikan/dibuka orang lain,
             file itu nggak ikut, jadi playernya kosong.
             Sekarang diganti ke embed Spotify (+ opsional YouTube),
             sama seperti contoh gambar: player Spotify di atas, video
             YouTube di bawahnya. -->
        <div class="side-player" id="sidePlayer">
          <div class="spotify-embed-wrap" id="spotifyWrap" style="display:none;">
            <iframe id="spotifyFrame" src="" allow="autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture" loading="lazy"></iframe>
          </div>
          <div class="youtube-embed-wrap" id="youtubeWrap" style="display:none;">
            <iframe id="youtubeFrame" src="" title="YouTube player" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe>
          </div>
          <div class="player-empty-hint" id="playerEmptyHint">Pilih lagu di bawah, atau tekan ♥ untuk dengar lagu pertama.</div>
        </div>
      </div>

      <div class="card" id="mixtapeCard">
        <h1 class="title">Songs for you</h1>

        <div class="cassette-wrap">
          <svg class="cassette" id="cassette" viewBox="0 0 300 190" fill="none">
            <rect x="4" y="4" width="292" height="182" rx="14" fill="#a6ac86" stroke="#7d845f" stroke-width="2"/>
            <rect x="20" y="18" width="260" height="60" rx="8" fill="#f2ecd8" stroke="#c9c2a3"/>
            <text x="150" y="52" text-anchor="middle" font-family="Playfair Display, serif" font-style="italic" font-size="16" fill="#6b6449">Songs for you</text>
            <path d="M30 30 C60 20, 70 45, 55 55" stroke="#8a9a6e" stroke-width="1.4" fill="none"/>
            <path d="M270 30 C240 20, 230 45, 245 55" stroke="#8a9a6e" stroke-width="1.4" fill="none"/>

            <rect x="30" y="88" width="240" height="66" rx="6" fill="#efe7cd" stroke="#cfc6a4"/>
            <g class="reel" style="transform-origin:80px 121px;">
              <circle cx="80" cy="121" r="28" fill="#f2ecd8" stroke="#8d886b" stroke-width="2"/>
              <circle cx="80" cy="121" r="9" fill="#3b352a"/>
              <circle cx="65" cy="108" r="2.4" fill="#8d886b"/>
              <circle cx="95" cy="108" r="2.4" fill="#8d886b"/>
              <circle cx="65" cy="134" r="2.4" fill="#8d886b"/>
              <circle cx="95" cy="134" r="2.4" fill="#8d886b"/>
            </g>
            <g class="reel" style="transform-origin:220px 121px;">
              <circle cx="220" cy="121" r="28" fill="#f2ecd8" stroke="#8d886b" stroke-width="2"/>
              <circle cx="220" cy="121" r="9" fill="#3b352a"/>
              <circle cx="205" cy="108" r="2.4" fill="#8d886b"/>
              <circle cx="235" cy="108" r="2.4" fill="#8d886b"/>
              <circle cx="205" cy="134" r="2.4" fill="#8d886b"/>
              <circle cx="235" cy="134" r="2.4" fill="#8d886b"/>
            </g>
            <rect x="118" y="112" width="64" height="18" fill="#3b352a"/>

            <circle cx="20" cy="18" r="4" fill="#8d886b"/>
            <circle cx="280" cy="18" r="4" fill="#8d886b"/>
            <circle cx="20" cy="172" r="4" fill="#8d886b"/>
            <circle cx="280" cy="172" r="4" fill="#8d886b"/>

            <circle cx="120" cy="168" r="6" fill="#7a3b45"/>
            <circle cx="150" cy="170" r="4" fill="#7a3b45"/>
            <rect x="175" y="163" width="18" height="10" fill="#d98a97" transform="rotate(-14 175 163)"/>
          </svg>
        </div>

        <div class="content-grid">
          <div>
            <div class="tracklist" id="tracklist"></div>
            <div class="now-playing" id="nowPlaying">Mulai dari: <b>Gerilya Cinta</b></div>
          </div>

          <div class="liner-note">
            <div class="label">CATATAN</div>
            <p>Hei,</p>
            <p>Aku bikin kaset ini buatmu — yang beneran kaset, bukan CD.</p>
            <p>Tekan play.</p>
            <div class="sign">Yan</div>
          </div>
        </div>

      </div>
    </div>
  </div>

  <div class="heart-btn" id="heartBtn">♥</div>
</div>

<script>
  const stage = document.getElementById('stage');
  const envelope = document.getElementById('envelope');
  const petalBurst = document.getElementById('petalBurst');
  const heartBtn = document.getElementById('heartBtn');
  const sideStack = document.getElementById('sideStack');
  const bouquetPhoto = document.getElementById('bouquetPhoto');

  // taruh URL foto buketmu di sini (contoh: "https://.../foto.jpg")
  // kalau dikosongkan, ilustrasi bunga di bawah ini yang dipakai
  const bouquetImage = "";

  const bouquetIllustration = `
    <svg viewBox="0 0 300 240" fill="none" xmlns="http://www.w3.org/2000/svg">
      <path d="M150 240 C150 195, 147 165, 150 128" stroke="#8a9a6e" stroke-width="2.2" fill="none"/>
      <path d="M150 150 C150 190, 108 155, 82 108" stroke="#8a9a6e" stroke-width="1.8" fill="none"/>
      <path d="M150 150 C150 190, 192 155, 218 108" stroke="#8a9a6e" stroke-width="1.8" fill="none"/>
      <path d="M150 168 C150 198, 126 178, 112 148" stroke="#8a9a6e" stroke-width="1.5" fill="none"/>
      <path d="M150 168 C150 198, 174 178, 188 148" stroke="#8a9a6e" stroke-width="1.5" fill="none"/>
      <path d="M138 205 C120 200, 108 208, 98 222" stroke="#8a9a6e" stroke-width="1.6" fill="none"/>
      <path d="M162 205 C180 200, 192 208, 202 222" stroke="#8a9a6e" stroke-width="1.6" fill="none"/>
      <ellipse cx="103" cy="220" rx="10" ry="5" fill="#97a17c" transform="rotate(-24 103 220)"/>
      <ellipse cx="197" cy="220" rx="10" ry="5" fill="#97a17c" transform="rotate(24 197 220)"/>
      <g transform="translate(150,96)">
        <g fill="#e3a2ab">
          <ellipse cx="0" cy="-17" rx="9" ry="13"/>
          <ellipse cx="16" cy="-6" rx="9" ry="13" transform="rotate(72)"/>
          <ellipse cx="10" cy="15" rx="9" ry="13" transform="rotate(144)"/>
          <ellipse cx="-10" cy="15" rx="9" ry="13" transform="rotate(216)"/>
          <ellipse cx="-16" cy="-6" rx="9" ry="13" transform="rotate(288)"/>
        </g>
        <circle r="7" fill="#e3b562"/>
      </g>
      <g transform="translate(82,90) rotate(-8)">
        <g fill="#eccd93">
          <ellipse cx="0" cy="-13" rx="7" ry="10"/>
          <ellipse cx="12" cy="-4" rx="7" ry="10" transform="rotate(72)"/>
          <ellipse cx="8" cy="11" rx="7" ry="10" transform="rotate(144)"/>
          <ellipse cx="-8" cy="11" rx="7" ry="10" transform="rotate(216)"/>
          <ellipse cx="-12" cy="-4" rx="7" ry="10" transform="rotate(288)"/>
        </g>
        <circle r="5.5" fill="#b96c72"/>
      </g>
      <g transform="translate(218,90) rotate(8)">
        <g fill="#e7b8c4">
          <ellipse cx="0" cy="-13" rx="7" ry="10"/>
          <ellipse cx="12" cy="-4" rx="7" ry="10" transform="rotate(72)"/>
          <ellipse cx="8" cy="11" rx="7" ry="10" transform="rotate(144)"/>
          <ellipse cx="-8" cy="11" rx="7" ry="10" transform="rotate(216)"/>
          <ellipse cx="-12" cy="-4" rx="7" ry="10" transform="rotate(288)"/>
        </g>
        <circle r="5.5" fill="#c9a06a"/>
      </g>
      <circle cx="112" cy="122" r="7" fill="#97a17c"/>
      <circle cx="112" cy="122" r="2.6" fill="#f0e6d2"/>
      <circle cx="188" cy="122" r="7" fill="#d9a6ab"/>
      <circle cx="188" cy="122" r="2.6" fill="#f0e6d2"/>
      <circle cx="126" cy="72" r="5" fill="#f0d6c8"/>
      <circle cx="174" cy="72" r="5" fill="#c9d3a8"/>
      <circle cx="150" cy="58" r="4.5" fill="#f4ece4"/>
      <path d="M120 196 L180 196 L192 234 C170 246, 130 246, 108 234 Z" fill="#d68f92" opacity="0.92"/>
      <path d="M120 196 L180 196 L188 224 C168 234, 132 234, 112 224 Z" fill="#e2a6ac" opacity="0.6"/>
    </svg>
  `;
  bouquetPhoto.innerHTML = bouquetImage
    ? `<img src="${bouquetImage}" alt="Buket bunga">`
    : bouquetIllustration;

  // ============================================================
  // DAFTAR LAGU
  // ------------------------------------------------------------
  // spotify : ID track Spotify (bukan link lengkap).
  //   Cara ambil: buka lagunya di app/situs Spotify > tombol "..." atau
  //   Share > "Copy Song Link". Kamu bakal dapat link kayak:
  //     https://open.spotify.com/track/3n3Ppam7vgaVa1iaRUc9Lp?si=abc123
  //   ID-nya adalah bagian setelah "/track/" dan sebelum "?", yaitu:
  //     3n3Ppam7vgaVa1iaRUc9Lp
  //   Ganti semua "SPOTIFY_ID_DISINI" di bawah dengan ID asli lagu kamu.
  // yt : ID video YouTube (opsional, buat tampilkan video juga di bawah
  //   player Spotify, boleh dikosongkan "").
  // ============================================================
  const tracks = [
    { name: "Gerilya Cinta", artist: "Kaleb J", spotify: "3KY5EGVVpbacFw79dpricc", yt: "2XyFohGvUtU" },
    { name: "cherry flavoured love inside your heart", artist: "wave to earth", spotify: "2tBaswRea2Mw9eUrDdVtAD", yt: "MxvBN-5E_Yw" },
    { name: "Helmet", artist: "Fafa", spotify: "3IZS0nwRvCG2NvqZQaaIFi", yt: "iYmOYAniVR8" },
    { name: "THANK YOU 4 LOVIN' ME", artist: "Paul Partohap", spotify: "43HSI1uHPQ6SWGUwS2dW95", yt: "Ul5IgSzGbWs" }
  ];

  const tracklistEl = document.getElementById('tracklist');
  const sidePlayer = document.getElementById('sidePlayer');
  const spotifyWrap = document.getElementById('spotifyWrap');
  const spotifyFrame = document.getElementById('spotifyFrame');
  const youtubeWrap = document.getElementById('youtubeWrap');
  const youtubeFrame = document.getElementById('youtubeFrame');
  const playerEmptyHint = document.getElementById('playerEmptyHint');
  const nowPlaying = document.getElementById('nowPlaying');
  const mixtapeCard = document.getElementById('mixtapeCard');

  let activeBtn = null;
  let activeRow = null;

  tracks.forEach((t, i) => {
    const row = document.createElement('div');
    row.className = 'track-row';
    row.innerHTML = `
      <div class="track-num">${String(i + 1).padStart(2, '0')}</div>
      <div class="track-info">
        <div class="track-name">${t.name}</div>
        <div class="track-artist">${t.artist}</div>
      </div>
      <button class="play-btn" aria-label="Putar ${t.name}">▶</button>
    `;
    const btn = row.querySelector('.play-btn');
    btn.addEventListener('click', () => playTrack(t, btn, row));
    tracklistEl.appendChild(row);
  });

  function playTrack(t, btn, row){
    if (activeBtn) { activeBtn.classList.remove('active'); activeBtn.textContent = '▶'; }
    if (activeRow) { activeRow.classList.remove('active-row'); }
    btn.classList.add('active');
    btn.textContent = '❚❚';
    activeBtn = btn;
    activeRow = row;
    if (row) row.classList.add('active-row');

    // Spotify embed
    if (t.spotify && t.spotify !== 'SPOTIFY_ID_DISINI') {
      spotifyFrame.src = `https://open.spotify.com/embed/track/${t.spotify}?utm_source=generator&autoplay=1`;
      spotifyWrap.style.display = 'block';
    } else {
      spotifyWrap.style.display = 'none';
    }

    // YouTube embed (opsional, dobel bareng Spotify kayak contoh)
    if (t.yt) {
      youtubeFrame.src = `https://www.youtube.com/embed/${t.yt}?autoplay=1`;
      youtubeWrap.style.display = 'block';
    } else {
      youtubeFrame.src = '';
      youtubeWrap.style.display = 'none';
    }

    playerEmptyHint.style.display = (spotifyWrap.style.display === 'none' && youtubeWrap.style.display === 'none')
      ? 'block' : 'none';

    nowPlaying.innerHTML = `Sedang diputar: <b>${t.name}</b>`;
    sideStack.classList.add('visible');
    sidePlayer.classList.add('visible');
    mixtapeCard.classList.add('playing');
    heartBtn.classList.add('liked');
  }

  // ---- scene 1 -> 2: buka amplop ----
  envelope.addEventListener('click', () => {
    if (stage.classList.contains('scene-bloom') || stage.classList.contains('scene-card')) return;
    envelope.classList.add('open');
    setTimeout(() => {
      spawnPetals();
      stage.classList.add('scene-bloom');
    }, 420);

    setTimeout(() => {
      stage.classList.add('scene-card');
      window.scrollTo({ top: 0, behavior: 'instant' in document.documentElement.style ? 'instant' : 'auto' });
    }, 1900);
  });

  function spawnPetals(){
    const colors = ['#e7b3ba', '#f0d6c8', '#c9d3a8', '#e3c08a', '#d68f92'];
    for (let i = 0; i < 26; i++){
      const p = document.createElement('div');
      p.className = 'petal';
      const angle = Math.random() * Math.PI * 2;
      const dist = 160 + Math.random() * 260;
      const tx = Math.cos(angle) * dist;
      const ty = Math.sin(angle) * dist;
      p.style.setProperty('--tx', `${tx}px`);
      p.style.setProperty('--ty', `${ty}px`);
      p.style.setProperty('--rot', `${(Math.random()*160)-80}deg`);
      p.style.left = '50%';
      p.style.top = '50%';
      p.style.background = colors[Math.floor(Math.random()*colors.length)];
      p.style.animationDelay = `${Math.random()*0.25}s`;
      petalBurst.appendChild(p);
    }
  }

  
  // ---- tombol ♥ kiri bawah: buka/tutup panel player ----
  // Klik pertama: kalau belum ada lagu yang jalan, otomatis putar lagu
  // pertama dan buka panelnya. Klik lagi: cuma toggle buka/tutup panel.
  heartBtn.addEventListener('click', () => {
    heartBtn.classList.toggle('liked');

    if (!activeBtn) {
      const firstRow = tracklistEl.querySelector('.track-row');
      const firstBtn = firstRow.querySelector('.play-btn');
      playTrack(tracks[0], firstBtn, firstRow);
      return;
    }

    sideStack.classList.toggle('visible');
    sidePlayer.classList.toggle('visible');
  });
</script>
